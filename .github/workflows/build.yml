name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Compile installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\UrlRouter.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: UrlRouter-windows-x64
          path: artifacts/UrlRouter-Setup-x64.exe
